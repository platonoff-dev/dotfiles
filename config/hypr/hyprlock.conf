general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/north.png
    blur_passes = 3
    blur_size = 8
    contrast = 1.0
    brightness = 0.6
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ebdbb2ff)
    font_size = 120
    font_family = CaskaydiaCove Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(d5c4a1ff)
    font_size = 22
    font_family = CaskaydiaCove Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(fe8019ff)
    font_size = 14
    font_family = CaskaydiaCove Nerd Font
    position = 0, -90
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(fe8019ee)
    inner_color = rgba(282828cc)
    font_color = rgba(ebdbb2ff)
    fade_on_empty = true
    placeholder_text = <i><span foreground="##d5c4a1aa">Enter password…</span></i>
    hide_input = false
    rounding = 14
    check_color = rgba(8ec07cee)
    fail_color = rgba(fb4934ee)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(fabd2fee)
    position = 0, -160
    halign = center
    valign = center
}
