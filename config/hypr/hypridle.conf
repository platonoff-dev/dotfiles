general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim the backlight gently
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r && ~/.config/hypr/scripts/screensaver-stop.sh
}

# Start the ASCII screensaver
listener {
    timeout = 270
    on-timeout = ~/.config/hypr/scripts/screensaver-start.sh
    on-resume = ~/.config/hypr/scripts/screensaver-stop.sh
}

# Lock the session (screensaver keeps running underneath the lock)
listener {
    timeout = 360
    on-timeout = loginctl lock-session
    on-resume = ~/.config/hypr/scripts/screensaver-stop.sh
}

# Power down the display
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off && ~/.config/hypr/scripts/screensaver-stop.sh
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# Suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
