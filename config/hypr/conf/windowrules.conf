windowrule {
    name = suppress-maximize
    match:class = .*

    suppress_event = maximize
}

# Fix XWayland drag-and-drop ghosts
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Floating utility windows
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = yes
}

windowrule {
    name = float-blueman-manager
    match:class = ^(blueman-manager)$
    float = yes
}

windowrule {
    name = float-nm-connection-editor
    match:class = ^(nm-connection-editor)$
    float = yes
}

windowrule {
    name = float-polkit-kde
    match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
    float = yes
}

windowrule {
    name = float-xdg-desktop-portal-gtk
    match:class = ^(xdg-desktop-portal-gtk)$
    float = yes
}

windowrule {
    name = float-nwg-displays
    match:class = ^(nwg-displays)$
    float = yes
}

windowrule {
    name = float-pip
    match:title = ^(Picture-in-Picture)$
    float = yes
}

windowrule {
    name = float-open-file
    match:title = ^(Open File)$
    float = yes
}

windowrule {
    name = float-save-file
    match:title = ^(Save File)$
    float = yes
}

windowrule {
    name = float-save-as
    match:title = ^(Save As)$
    float = yes
}

# Center floats
windowrule {
    name = center-floats
    match:float = true
    center = yes
}

# Picture-in-Picture: pin, size, position
windowrule {
    name = pip-pin
    match:title = ^(Picture-in-Picture)$
    pin = yes
}

windowrule {
    name = pip-size
    match:title = ^(Picture-in-Picture)$
    size = 480 270
}

windowrule {
    name = pip-move
    match:title = ^(Picture-in-Picture)$
    move = 100%-500 100%-290
}

# ASCII screensaver: fullscreen, on top, no chrome
windowrule {
    name = screensaver-fullscreen
    match:class = ^(hypr-screensaver)$
    fullscreen = yes
    pin = yes
    border_size = 0
    rounding = 0
    no_anim = yes
    no_focus = false
}

# Smart gaps: drop borders + rounding when only one tiled window
workspace = w[tv1], gapsout:0, gapsin:0

windowrule {
    name = no-border-solo-tile
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
}

windowrule {
    name = no-rounding-solo-tile
    match:float = false
    match:workspace = w[tv1]
    rounding = 0
}
