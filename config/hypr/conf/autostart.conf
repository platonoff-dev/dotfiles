exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/wallpaper-loop.sh
# swaync: load whichever style.css the darkman hook last placed in the cache.
# Seed it with the dark variant on first boot if the hook hasn't run yet.
exec-once = sh -c 'mkdir -p "$HOME/.cache/swaync" && [ -f "$HOME/.cache/swaync/style.css" ] || cp "$HOME/.config/swaync/style-dark.css" "$HOME/.cache/swaync/style.css"; exec swaync --style "$HOME/.cache/swaync/style.css"'
exec-once = hypridle

# Clipboard manager — listen for new copies and persist them
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Volume / brightness OSD
exec-once = swayosd-server

# Tray applets
exec-once = nm-applet --indicator
exec-once = blueman-applet
