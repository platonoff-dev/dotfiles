# Starship prompt configuration

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[python]
format = '[py $version]($style) '

[nodejs]
format = '[node $version]($style) '

[rust]
format = '[rs $version]($style) '

[golang]
format = '[go $version]($style) '
