# Read by systemd's user manager (and pam_systemd) at session start.
# Mirrors the env= line in hypr/conf/env.conf so anything spawned outside
# Hyprland's tree (systemd user units, dbus-activated services, etc.)
# also sees flatpak .desktop files.
XDG_DATA_DIRS=$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
