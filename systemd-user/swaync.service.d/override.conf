# Override the system-shipped swaync.service so it always launches with the
# darkman-managed cache style, regardless of whether it was started by Hyprland's
# `exec-once` or by D-Bus activation on the org.freedesktop.Notifications bus.
#
# Symlinked into ~/.config/systemd/user/swaync.service.d/ by setup.py.

[Service]
# Reset the upstream ExecStart, then provide our own.
ExecStart=
ExecStartPre=/bin/sh -c '[ -f %h/.cache/swaync/style.css ] || (mkdir -p %h/.cache/swaync && cp %h/.config/swaync/style-dark.css %h/.cache/swaync/style.css)'
ExecStart=/usr/bin/swaync --style %h/.cache/swaync/style.css
